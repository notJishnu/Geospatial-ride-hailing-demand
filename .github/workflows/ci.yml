name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests import components from every optional runtime surface.
      - run: uv sync --all-extras
      - run: uv run ruff format --check 
      - run: uv run ruff check 
      - run: uv run pytest
      # Parsing validates models without downloading Git-ignored TLC data.
      - run: uv run dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - run: docker build --tag nyc-mobility-eta:ci 
