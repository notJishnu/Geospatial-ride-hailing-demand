project:
  name: nyc-mobility-analytics
  timezone: America/New_York
  random_seed: 42
  h3_resolution: 8

months:
  - "2024-01"

paths:
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  reference: data/reference
  manifests: data/manifests
  warehouse: data/warehouse/nyc_mobility.duckdb

sources:
  tlc:
    trip_data_url_template: "https://d37ci6vzurychx.cloudfront.net/trip-data/fhvhv_tripdata_{month}.parquet"
    trip_data_page: "https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page"
    data_dictionary: "https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_hvfhs.pdf"
  zones:
    lookup_url: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"
    geometry_url: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zones.zip"
  weather:
    archive_url: "https://archive-api.open-meteo.com/v1/archive"
    latitude: 40.71
    longitude: -74.01
    timezone: America/New_York
    hourly: [temperature_2m, precipitation, snowfall, wind_speed_10m]

ingestion:
  timeout_seconds: 120
  chunk_size_bytes: 1048576
  min_file_size_bytes: 1024
  overwrite: false
  checksum_algorithm: sha256

cleaning:
  min_trip_seconds: 60
  max_trip_seconds: 21600
  max_trip_miles: 200
  max_average_speed_mph: 80
  unknown_zone_ids: [264, 265]
  month_boundary_tolerance_hours: 6

splits:
  test_weeks: 4

forecasting:
  demand:
    test_days: 7
    validation_days: 7
    rolling_origin_folds: 2
    lag_hours: [1, 2, 3, 24, 168]
    rolling_windows_hours: [24, 168]
    statsforecast_top_zones: 10
    lightgbm:
      learning_rate: 0.05
      n_estimators: 500
      num_leaves: 31
      random_state: 42
      n_jobs: 4
  eta:
    test_days: 7
    validation_days: 7
    train_sample_percent: 5
    validation_sample_percent: 10
    optuna_trials: 10
    shap_sample_size: 1000
    airport_zone_ids: [1, 132, 138]
    lightgbm:
      learning_rate: 0.05
      n_estimators: 500
      random_state: 42
      n_jobs: 4

monitoring:
  output_dir: artifacts/monitoring
  thresholds:
    max_reject_rate: 0.02
    max_eta_mae_increase_fraction: 0.15
    eta_baseline_mae_seconds: 224.46922304371282
  drift:
    # Set current_month only after a second completed monthly partition exists.
    reference_month: "2024-01"
    current_month: null
    sample_size: 50000
    max_drifted_columns_share: 0.3
