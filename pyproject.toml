[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nyc-mobility-analytics"
version = "0.1.0"
description = "Local analytics and ML platform for NYC HVFHV mobility data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dbt-core==1.9.3",
  "dbt-duckdb==1.9.3",
  "duckdb==1.2.2",
  "geopandas==1.0.1",
  "h3==4.2.2",
  "holidays==0.67",
  "polars==1.24.0",
  "pyarrow==19.0.1",
  "pydantic==2.10.6",
  "pyproj==3.7.1",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "shapely==2.0.7",
]

[project.optional-dependencies]
ml = ["lightgbm==4.6.0", "mlflow==2.21.3", "optuna==4.2.1", "scikit-learn==1.6.1", "shap==0.47.1", "statsforecast==2.0.0"]
orchestration = ["dagster==1.9.13", "dagster-webserver==1.9.13"]
serving = ["fastapi==0.115.11", "httpx==0.28.1", "uvicorn[standard]==0.34.0"]
dashboard = ["pydeck==0.9.1", "streamlit==1.43.2"]
monitoring = ["evidently==0.6.7"]
dev = ["pre-commit==4.1.0", "pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.9.10"]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
